<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div>
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg w-96 flex flex-col gap-5">
            <h1 class="text-2xl font-bold mb-4 text-center">Task Manager</h1>
            <form class="form flex flex-col mb-6">
                <input type="text" id="taskInput" placeholder="Enter task..."
                    class="w-full p-2 mb-3 rounded text-black">

                <button type="submit" class="w-full bg-green-500 p-2 mb-2 rounded">
                    Add Task
                </button>
            </form>

            <!-- Task List -->
            <ul id="taskList" class="space-y-2"></ul>

            <!-- Select All + Delete Selected -->
            <div class="flex justify-between">
                <button id="clearBtn" class="w-full bg-yellow-500 p-2 rounded">
                    Clear All
                </button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
