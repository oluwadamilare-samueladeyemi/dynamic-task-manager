<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg w-96">
            <h1 class="text-2xl font-bold mb-4 text-center">Task Manager</h1>

            <input type="text" id="taskInput" placeholder="Enter task..." class="w-full p-2 mb-3 rounded text-black">

            <button id="addBtn" class="w-full bg-green-500 p-2 mb-2 rounded">
                Add Task
            </button>

            <button id="deleteBtn" class="w-full bg-red-500 p-2 mb-2 rounded">
                Delete Specific Task
            </button>

            <button id="clearBtn" class="w-full bg-yellow-500 p-2 rounded">
                Clear All
            </button>

            <!-- Select All + Delete Selected -->
<div class="flex justify-between mt-3 mb-2">
    <button id="selectAllBtn" class="bg-blue-500 px-2 py-1 rounded text-sm">
        Select All
    </button>

    <button id="deleteSelectedBtn" class="bg-red-600 px-2 py-1 rounded text-sm">
        Delete Selected
    </button>
</div>

<!-- Task List -->
<ul id="taskList" class="mt-3 space-y-2"></ul>
        </div>
    </div>
   
    <script src="script.js"></script>
</body>

</html>
